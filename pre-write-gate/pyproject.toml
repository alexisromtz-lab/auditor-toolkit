# HUELLA-PRE-WRITE-GATE-PYPROJECT-20261015
#
# SEGUNDO pyproject DEL REPO (declarado, no accidental).
# La raiz declara "platino-core" (biblioteca) con descubrimiento de paquetes;
# este declara la HERRAMIENTA "pre-write-gate" como py-module SUELTO.
# La raiz NO conoce este paquete y este paquete NO conoce la raiz:
#   pip install ./pre-write-gate        -> instala el comando `pre-write-gate`
#   (desde la raiz: pip install .       -> instala platino-core, NO esto)
# UNIVERSO DECLARADO: rutas del arbol git donde se corre `git hash-object`.
# MOTOR: python3 >= 3.10 stdlib + binario `git` en PATH. CERO dependencias.
# FAIL-CLOSED: sin `git`, el gate sale RC 30 (MOTOR_INCOMPLETO).

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pre-write-gate"
version = "0.1.0"
description = "Puerta de PRE-VUELO bloqueante (A2.1): verifica la tupla de destino antes de escribir (blob, huella, lineas). Read-only."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Jose Alexis Roman Martinez" }]
keywords = [
  "agents",
  "multi-agent",
  "write-gate",
  "collision",
  "fail-closed",
  "pre-commit",
  "monorepo",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Version Control :: Git",
]

# CERO dependencias externas: stdlib + subprocess a `git`.
dependencies = []

[project.urls]
Homepage = "https://github.com/alexisromtz-lab/platino-corpus"
Source = "https://github.com/alexisromtz-lab/platino-corpus"

[project.scripts]
# Modulo suelto (no paquete): el archivo vive junto a este pyproject.
pre-write-gate = "gate_pre_escritura:main"
pwg = "gate_pre_escritura:main"

[tool.setuptools]
py-modules = ["gate_pre_escritura"]

[tool.pre-write-gate]
# Contrato del artefacto, legible por maquina (lo lee hooks/pre-commit).
tuplas = "tuplas.declaradas.tsv"
rc_no_bloqueantes = [0, 10, 11]
rc_bloqueantes = [12, 13, 14, 15, 20, 30, 31]
